# N64Recomp config: Pokémon Stadium (US 1.0) -> C (first pass)
# Run from Stadium-mod/:  tools/N64Recomp/build/Release/N64Recomp.exe recomp/stadium1/us.toml
# Input: the matching decomp build's ELF (build/stadium1, md5 ed1378bc...).
# The 77 fragments are the game's run-time loaded code (each relocated by the
# game's own loader), so they're relocatable sections, as Zelda64Recomp's overlays.
[input]
entrypoint = 0x80000400
# decomp ELF + the hidden (compressed) code fragments: tools/build_hidden_fragments.py
elf_path = "../../build/stadium1/pokestadium-us-ext.elf"
output_func_path = "../../build/stadium1/RecompiledFuncs"
relocatable_sections_path = "relocatable_sections_ext.txt"
functions_per_output_file = 200
# Fragments keep their bss in a separate ".fragmentN_bss" section (right after code+data,
# relocated together by the game). Pair them so references to bss variables are
# relocated with the fragment instead of staying at the link address.
bss_section_suffix = "_bss"

# Unnamed static functions (no ELF symbol) N64Recomp mis-sizes. libultra env.c
# after _ldexpf: _getRate / _getVol / one more; boundaries from tools/disasm_range.sh.
# libultra sprintf.c: static proutSprintf (no symbol), passed by pointer to _Printf.
[[input.manual_funcs]]
name = "proutSprintf"
section = ".text"
vram = 0x8005E020
size = 0x24

[[input.manual_funcs]]
name = "env_static_80061054"
section = ".text"
vram = 0x80061054
size = 0x1E4

[[input.manual_funcs]]
name = "env_static_80061238"
section = ".text"
vram = 0x80061238
size = 0x2C

[[input.manual_funcs]]
name = "env_static_80061264"
section = ".text"
vram = 0x80061264
size = 0x84

[patches]
# Hardware-only code the PC port never runs (empty functions in the output):
#   __LeoBootGame3: boots from the 64DD disk drive (cop0 TagLo)
#   set_watch_lohi: sets the CPU's debug watchpoint (cop0 WatchLo/Hi)
stubs = [
    "func_812096A0",  # stub range
    "func_81209870",  # stub range
    "func_81209EB4",  # stub range
    "func_8120A4F4",  # stub range
    "func_8120A5A4",  # stub range
    "func_8120A5F8",  # stub range
    "func_8120A5FC",  # stub range
    "func_8120A65C",  # stub range
    "func_8120A660",  # stub range
    "func_8120A69C",  # stub range
    "func_8120A6A0",  # stub range
    "func_8120B3F4",  # stub range
    "func_8120B490",  # stub range
    "func_8120C5FC",  # stub range
    "func_8120C72C",  # stub range
    "func_8120D5BC",  # stub range
    "func_8120D60C",  # stub range
    "func_8120D7C0",  # stub range
    "func_8120D7C8",  # stub range
    "__LeoBootGame3",
    "set_watch_lohi",
]
ignored = []
# game functions named like C library ones (would clash with <math.h>): get a _recomp suffix
renamed = ["fabsf"]

# Fragments: the game copies a fragment from ROM into a heap block and relocates
# it there (Memmap_RelocateFragment -> Memmap_SetFragmentMap(id, ram, sizeInRam)),
# and forgets it when the block is freed (Memmap_ClearFragmentMemmap(id)).
# The port's runtime has to know which recompiled section now runs at that
# address: port/src/fragments.cpp maps id (+ size) -> section -> load_overlays().
# No 64DD disk drive on PC: the manager setup reports an error at once
# (41 = LEO_ERROR_DEVICE_COMMUNICATION_FAILURE) instead of probing the drive's
# registers (rsp.c func_800005C0 then leaves 64DD support off).
[[patches.hook]]
func = "LeoCJCreateLeoManager"
text = "    ctx->r2 = 41; return;"

# Game_DoCopyProtection reads ROM 0xE38 straight off the cartridge bus
# (0xB0000E38, expects 0x828A). The port has already checked the whole ROM's hash,
# so the original cartridge is there: return the state unchanged, as it would.
# It's also the one place every game state passes through: port/src/boot.cpp
# stadium_filter_state turns states the port doesn't offer (GB Tower) into Area Select.
[[patches.hook]]
func = "Game_DoCopyProtection"
text = "    { extern int32_t stadium_filter_state(int32_t); ctx->r2 = (gpr)stadium_filter_state((int32_t)ctx->r4); return; }"

# Quick boot (port/src/boot.cpp): func_800290E4(id) plays a demo/movie; id 0x12 is
# the intro after the N64 logo. Skipped (returns 0 = not interrupted) unless --intro.
[[patches.hook]]
func = "func_800290E4"
text = "    { extern int stadium_skip_demo(uint32_t); if (stadium_skip_demo((uint32_t)ctx->r4)) { ctx->r2 = 0; return; } }"

# Quick boot: Menu Select (fragment57) shows the "Game Pak Check" screen first when
# entered from the title (a1 != 0); left out on the quick boot's first arrival.
[[patches.hook]]
func = "func_82D06D0C"
text = "    { extern int stadium_skip_gbcheck(void); if (stadium_skip_gbcheck()) ctx->r5 = 0; }"

# Kids Club PVP (port/src/pvp.cpp). fragment2 func_87802F00(slot) = a slot won a
# minigame: at 0x87802F20 v0 = &D_8780FA40[slot] (the wins array's run-time address).
[[patches.hook]]
func = "func_87802F00"
before_vram = 0x87802F20
text = "    { extern void stadium_pvp_win(uint8_t*, uint32_t, int32_t); stadium_pvp_win(rdram, (uint32_t)ctx->r2, (int32_t)ctx->r4); }"

