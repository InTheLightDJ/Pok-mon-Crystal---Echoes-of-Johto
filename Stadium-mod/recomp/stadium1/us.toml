text = "    { extern void stadium_trace(uint8_t*, const char*, uint32_t, uint32_t); stadium_trace(rdram, \"start\", (uint32_t)ctx->r4, 0); }"

[[patches.hook]]
func = "func_80005084"
text = "    { extern void stadium_trace(uint8_t*, const char*, uint32_t, uint32_t); stadium_trace(rdram, \"sp_done\", MEM_W(0xA14, (gpr)(int32_t)0x800A62E0), 0); }"

[[patches.hook]]
func = "func_80005148"
text = "    { extern void stadium_trace(uint8_t*, const char*, uint32_t, uint32_t); stadium_trace(rdram, \"dp_done\", 0, 0); }"

[[patches.hook]]
