# fragment2 func_878001E8(n) = random 0..n-1: the roulette's final pick follows the seed.
[[patches.hook]]
func = "func_878001E8"
text = "    { extern int32_t stadium_pvp_random(int32_t); int32_t r_ = stadium_pvp_random((int32_t)ctx->r4); if (r_ >= 0) { ctx->r2 = (gpr)r_; return; } }"

