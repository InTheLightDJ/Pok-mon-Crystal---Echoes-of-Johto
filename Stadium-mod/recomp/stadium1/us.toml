# The audio manager (3D140.c func_8003CADC) reads AI_LEN_REG (0xA4500004) directly.
# The load becomes `or $v1, $zero, $zero` and a hook right after it puts the
# runtime's queued audio length in $v1 (as osAiGetLength would).
[[patches.instruction]]
func = "func_8003CADC"
vram = 0x8003CB28
value = 0x00001825

[[patches.hook]]
func = "func_8003CADC"
before_vram = 0x8003CB2C
text = "    { extern uint32_t stadium_ai_len(void); ctx->r3 = (gpr)(int32_t)stadium_ai_len(); }"

# func_800484E0 counts the sound voices still playing; the game busy-waits on it
# (DDC0.c func_8000D2B4: leaving the title screen waits for the music to stop).
# On the N64 the audio thread preempts that loop; the runtime schedules game
# threads cooperatively, so the loop must yield or the audio thread never runs.
[[patches.hook]]
func = "func_800484E0"
text = "    { extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"

# func_80001C90 (dp_intro.c) = "is the frame queue free?"; callers spin on it
# (`while (func_80001C90() == 0) {}`: JPEG decode 3FB0.c, stage loader, 1AB70.c...).
# Same as above: with cooperative game threads the spin must yield or the thread
# that empties the queue never runs (froze entering a Stadium cup).
[[patches.hook]]
func = "func_80001C90"
text = "    { extern void yield_self_1ms(uint8_t*); yield_self_1ms(rdram); }"

# The game's RSP scheduler (5580.c) asks a running gfx task to yield when audio is
# due (func_80004AB4 -> osSpTaskYield, state 2) and later resumes it. The runtime
# runs gfx and audio on separate threads, ignores yields and reports gfx RSP-done at
# once, so the yield/resume bookkeeping misattributes completions and gfx frames get
# lost (battle screen froze: 388 gfx tasks started, ~90 rendered). Never yield: the
# gfx task just finishes first (instantly here) and audio follows.
# DISABLED (test) [[patches.hook]] func_80004AB4 ctx->r2 = 0; return;

# Scheduler trace (port/src/trace.cpp, printed only with STADIUM_TRACE set):
